<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="app-header">
    <h1>Student Expense Tracker</h1>
    <p>Take control of your money.</p>

    <nav>
        <button id="showAddSection">Add Expense</button>
        <button id="showExpensesSection">My Expenses</button>
    </nav>
</header>

<main>
    <!-- SECTION 1: INPUT -->
    <section id="addExpenseSection" class="page-section">
        <div class="panel">
            <h2>Record a New Expense</h2>

            <label for="description">Description</label>
            <input type="text" id="description"
                   placeholder="e.g. Lunch">

            <label for="amount">Amount (KES)</label>
            <input type="number" id="amount"
                   placeholder="e.g. 150" min="0.01" step="0.01">

            <label for="category">Category</label>
            <select id="category">
                <option value="">Select category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="School">School</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
            </select>

            <label for="date">Date</label>
            <input type="date" id="date" min="1900-01-01" max="2100-12-31" required>

            <button id="addExpense">Save Expense</button>
        </div>
    </section>

    <!-- SECTION 2: RECORDS -->
    <section id="expensesSection" class="page-section" hidden>
        <div class="panel records-panel">
            <h2>My Expenses</h2>

            <div class="summary">
                <span>Total for current view</span>
                <strong>KES <span id="totalAmount">0.00</span></strong>
                <small id="expenseCount">0 expenses</small>
            </div>

            <label for="filterCategory">Filter by category</label>
            <select id="filterCategory">
                <option value="All">All Categories</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="School">School</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
            </select>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th>Amount (KES)</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="expenses"></tbody>
                </table>
            </div>

            <p id="emptyMessage" hidden>
                No expenses found for this category.
            </p>
        </div>
    </section>
</main>


<!-- SUCCESS POPUP -->
<div id="successModal" class="modal-overlay" hidden>
    <div class="success-modal"
         role="dialog"
         aria-modal="true"
         aria-labelledby="successTitle"
         aria-describedby="successMessage">

        <div class="success-icon" aria-hidden="true">✓</div>

        <h2 id="successTitle">Expense Recorded!</h2>

        <p id="successMessage">
            Your expense has been saved successfully.
        </p>

        <div class="modal-actions">
            <button id="viewExpensesButton" type="button">
                View Expenses
            </button>

            <button id="addAnotherButton" type="button">
                Add Another Expense
            </button>
        </div>
    </div>
</div>


<script src="script.js"></script>

</body>
</html>
