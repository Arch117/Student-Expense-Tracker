<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- This is the main content area -->

    <h1>Student Expense Tracker</h1>

      <p>Track where your money goes.</p>

       <div class="expense-form">

    <h2>Add Expense</h2>

    <label for="description">Description</label>
    <input type="text" id="description" placeholder="e.g. Lunch"><br><br>

    <label for="amount">Amount (KES)</label>
    <input type="number" id="amount" placeholder="e.g. 150"><br><br>

    <label for="category">Category</label>
    <select id="category">
        <option value="">Select category</option>
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="School">School</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Other">Other</option>
    </select>
    <br><br>

    <label for="date">Date</label>
    <input type="date" id="date"> <br><br>

    <button id="addExpense">Add Expense</button>

</div>

 <div class="expense-list">

    <h2>My Expenses</h2>

    <div id="expenses"></div>

</div>


    <script src="script.js"></script>
</body>
</html>
